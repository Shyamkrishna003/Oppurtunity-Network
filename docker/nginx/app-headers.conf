# Security headers for the web app's own files. Included per location, because a location
# that adds any header no longer inherits the ones set above it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# The check-in scanner uses the camera; nothing else is needed.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# Everything the app loads comes from its own origin: scripts, fonts, the API and the live
# connection. 'unsafe-inline' is for style attributes only (bar widths and the like);
# scripts get no such exception. Images may also be data: or blob: (QR codes, previews).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
