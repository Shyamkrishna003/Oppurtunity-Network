map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# WebSocket URLs will carry single-use tickets in the query string; keep them out of logs.
log_format without_query '$remote_addr [$time_local] "$request_method $uri" $status $request_id';

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    # $http_host keeps the port, which Django needs for CSRF origin checks.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Always overwrite: request IDs are generated here, never accepted from clients.
    proxy_set_header X-Request-ID $request_id;

    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://backend;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://backend;
        access_log off;
    }

    # A location that sets any proxy header stops inheriting the server-level ones,
    # so the two upgrade-capable locations below repeat the full set.
    location /ws/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        access_log /var/log/nginx/access.log without_query;
    }

    # Everything else is the SPA (Vite dev server, including its HMR socket).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
